 for(let y=MY0;y<=29;y++)for(let x=0;x<=54;x++){const X=x*MT,Y=(y-MY0)*MT,t=sp(x,y);

 g.fillStyle='#b4bec2';
 for(let y=MY0;y<=29;y++)for(let x=0;x<=54;x++){if(wall(x,y))continue;const X=x*MT,Y=(y-MY0)*MT;

 g.fillStyle='#e0b84a';
 for(let y=MY0;y<=29;y++)for(let x=0;x<=54;x++){const d=DR[y*NW+x];if(d&&d.t=='door')g.fillRect(x*MT,(y-MY0)*MT+MT/2-2,MT,4)}

  while(fs>7&&Math.max(...L.map(l=>g.measureText(l).width))>w-4){fs--;g.font='bold '+fs+'px '+MF}
  const cx=(r.a+r.b+1)/2*MT,cy=((r.y0+r.y1+1)/2-MY0)*MT;L.forEach((l,i)=>txt(l,cx,cy+(i-(L.length-1)/2)*(fs+2),fs,'#ece4d0'))}
 if(fl<2)txt('계단',27.5*MT,(11.5-MY0)*MT,10,'#dfe9ec');txt('계단',27.5*MT,(19.6-MY0)*MT,10,'#dfe9ec');
 txt('복도',10*MT,(15-MY0)*MT,10,'#9fb0b8');txt('복도',44*MT,(15-MY0)*MT,10,'#9fb0b8');
 if(!fl)txt('지하실',25.5*MT+0,(10-MY0)*MT,7,'#f2c9c5');
 mapC=c}
